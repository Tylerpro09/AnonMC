name: Build AnonMC

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle 9.5.1
        shell: bash
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.5.1-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-9.5.1/bin" >> "$GITHUB_PATH"

      - name: Build
        run: gradle build --stacktrace

      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: anonmc-jars
          path: build/libs/*.jar
